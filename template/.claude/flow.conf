# Project settings for the spec-driven flow. Sourced (bash) by the hooks of the spec-flow plugin.
# Defaults are for the TypeScript monorepo (npm workspaces). An empty value turns that setting off.
# The checks themselves (lint, typecheck, tests) are run by the agent, see "Checks" in CLAUDE.md.

# Branch that holds the approved specs and receives the merged work. Nothing is edited or committed on it.
MAIN_BRANCH=main

# Where spec-flow:start puts a change's worktree, relative to the project: <WORKTREES_DIR>/<project>-<change>.
# Outside the project by default, so a Claude session in the worktree loads only the worktree's CLAUDE.md.
WORKTREES_DIR=..

# Dependency install for a fresh worktree (a change's or a parallel group's; skipped when DEPS_DIR exists there).
INSTALL_CMD="npm ci --prefer-offline --no-audit --no-fund --silent"
DEPS_DIR=node_modules

# Strict test first: 1 = the tdd-guard hook blocks edits to source files (SRC_PATTERN) until a test file
# (TEST_PATTERN) has changed on the branch. Off by default; the TDD rules in CLAUDE.md apply either way.
TDD_STRICT=0
SRC_PATTERN='^(apps|packages)/[^/]+/src/'
TEST_PATTERN='(\.test|\.spec)\.|(^|/)(tests?|__tests__)/'

# English-only rule: 1 = on. Other languages are allowed only under TRANSLATIONS_DIR, in paths matching
# LANGUAGE_IGNORE (a regex, e.g. '(^|/)fixtures/'; empty = none) and on lines marked "allow-non-english".
ENGLISH_ONLY=1
TRANSLATIONS_DIR=locales
LANGUAGE_IGNORE=''

# Folders the English-only check skips (besides .git and the translations).
IGNORED_DIRS="node_modules dist build coverage test-results playwright-report .turbo"
