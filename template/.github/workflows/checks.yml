# The full checks ("Checks" in CLAUDE.md, step 3), so the rules hold outside Claude Code too.
# TODO: keep the steps in sync with the root package.json scripts.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The English-only check comes from the spec-flow plugin repo, pinned to a release tag.
      - uses: actions/checkout@v4
        with:
          repository: hovorun-art/spec-flow-template
          ref: v3.1.0
          path: .spec-flow
      - run: mv .spec-flow "$RUNNER_TEMP/spec-flow" && "$RUNNER_TEMP/spec-flow/plugin/scripts/check-language.sh"
      - run: npm ci
      # The Turborepo cache of the root scripts lives in the git directory (see .claude/rules/tooling.md).
      - uses: actions/cache@v4
        with:
          path: .git/turbo-cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-
      - run: npm run check:full
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .git/turbo-cache
          key: turbo-e2e-${{ github.sha }}
          restore-keys: turbo-e2e-
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
